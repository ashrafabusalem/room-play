; Supervisor program for the Reverb WebSocket server.
;
; Reverb is a daemon, not a web request — nothing in OpenLiteSpeed starts it.
; Without a supervisor it dies on the first crash or reboot and rooms silently
; stop updating, while the REST API keeps working. That combination is
; confusing to debug, so treat this file as required, not optional.
;
; Install:
;   sudo cp roomplay-reverb.conf /etc/supervisord.d/roomplay-reverb.ini
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status roomplay-reverb
;
; On Ubuntu the directory is /etc/supervisor/conf.d/ and the file ends .conf.

[program:roomplay-reverb]
; Use the same PHP binary that runs artisan. The system `php` on a CyberPanel
; box is often an older build than the lsphp the site is configured for.
command=/usr/local/lsws/lsphp83/bin/php /home/REPLACE_DOMAIN/public_html/api/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/home/REPLACE_DOMAIN/public_html/api

; Bind to loopback only. OpenLiteSpeed terminates TLS and proxies to it, so the
; port must not be reachable from the internet directly — that would serve
; unencrypted ws:// alongside your wss:// and leak tokens.

autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10

; Runs as the site's user, not root. A compromised WebSocket process should not
; own the filesystem.
user=REPLACE_SITE_USER

redirect_stderr=true
stdout_logfile=/home/REPLACE_DOMAIN/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
