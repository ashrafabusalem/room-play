; Supervisor program for the queue worker.
;
; Broadcast events, password-reset emails and anything else dispatched to a
; queue sit in the jobs table until a worker picks them up. With no worker
; running, a user asks for a reset link and simply never receives one — no
; error anywhere.
;
; Install: same as roomplay-reverb.conf.

[program:roomplay-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/local/lsws/lsphp83/bin/php /home/REPLACE_DOMAIN/public_html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/home/REPLACE_DOMAIN/public_html

autostart=true
autorestart=true
stopwaitsecs=3600

user=REPLACE_SITE_USER

; Start with one. Add processes when the jobs table is visibly backing up, not
; before — each one is a full PHP process holding memory.
numprocs=1

redirect_stderr=true
stdout_logfile=/home/REPLACE_DOMAIN/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; NOTE: a worker holds the application in memory, so deployed code changes are
; not picked up until it restarts. `php artisan queue:restart` at the end of
; every deploy — the deploy script does this.
